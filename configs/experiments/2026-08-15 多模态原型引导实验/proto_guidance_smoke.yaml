# [ProtoGuidance] Smoke run：验证管线不崩 + train/proto/* 监控键输出 + aux loss 有限
# 用法: python src/scripts/train.py -c configs/experiments/proto_guidance_smoke.yaml
# 前置: 先运行 stage0 离线脚本生成原型产物（data/proto_guidance_shwx.pt）
model:
  variant: medium
  num_classes: 25
  resolution: 640
  gradient_checkpointing: false
  # 无 pretrain（随机初始化，仅验证管线）
  # --- 多模态原型引导：E3 全开（位置 + 内容 + 辅助损失） ---
  proto_guidance_enabled: true
  proto_guidance_artifacts_path: data/proto_guidance_shwx.pt
  proto_guidance_fusion_mode: simple
  proto_guidance_num_slots: 10
  proto_guidance_position_enabled: true
  proto_guidance_content_enabled: true
  proto_guidance_aux_loss_enabled: true
  proto_guidance_warmup_epochs: 1.0

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/0814-SHWX-ProtoGuidance-SMOKE
  epochs: 1
  batch_size: 4
  grad_accum_steps: 1
  num_workers: 2
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 1
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: false
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false
  sscl_freeze_strategy: conservative
  sscl_unfreeze_decoder_layers: 2
