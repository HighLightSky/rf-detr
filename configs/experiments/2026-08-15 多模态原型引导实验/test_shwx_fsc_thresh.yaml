# FSC/细粒度虚警优化测试配置：逐类置信度阈值（基于 0816-1024 模型预测扫描）
# 策略：只在"FDR 降幅 >2pt 且 recall 损失 <6pt"的类上提阈值
#   HM(0)=0.35（2 FP 全清，0 召回损失） QHS(2)=0.30（9 FP 清，1 框损）
#   A4(7)=0.55  E-3(10)=0.50  F-22(16)=0.45  KC-135(17)=0.50
#   B-1B(18)=0.55  SU-34(22)=0.50  FSC(24)=0.35（8 FP 清，2 框损）
# 预期（0816-1024 模型）：total FDR 0.180->0.133，total recall 0.947->0.938
test:
  dataset: shwx
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  resolution: 1024
  checkpoint: output/0816-SHWX-ProtoGuidance-1024/checkpoint_best_total.pth
  output_dir: output/0816-SHWX-ProtoGuidance-1024-thresh
  conf_threshold: 0.25
  class_conf_thresholds: {0: 0.35, 2: 0.30, 7: 0.55, 10: 0.50, 16: 0.45, 17: 0.50, 18: 0.55, 22: 0.50, 24: 0.35}
  device: cuda:0
  batch_size: 32
  num_workers: 12
  prefetch_factor: 3
  gpu_util_sample_interval: 0.5
  use_fp16: false
  save_fp_fn: false
  save_yolo_preds: false
