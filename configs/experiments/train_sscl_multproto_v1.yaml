# SSCL 多 slot 原型 v1：HM/LQS/QHS/MS 类内多模态 + 组内 sibling 负样本加压
# 用法: python src/scripts/train.py -c configs/experiments/train_sscl_multproto_v1.yaml
model:
  variant: medium
  num_classes: 25
  resolution: 640
  gradient_checkpointing: true
  pretrain_weights: output/0805-SHWX-data-expand-rfdetr-baseline/checkpoint_best_total.pth

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict
  dataset_file: yolo
  output_dir: output/0812-SHWX-SSCL-MultiProto-v1
  epochs: 6
  batch_size: 32
  grad_accum_steps: 2
  num_workers: 12
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 6
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false

  # --- SSCL 基础配置：沿用 0807 量级，不引入分类均衡与 LA ---
  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx.pt
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.02
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: [0, 1, 2, 3]
  sscl_confusing_classes: [0, 1, 2, 3]
  sscl_start_epoch: 0
  sscl_freeze_strategy: conservative

  # --- 多 slot 原型 v1 ---
  sscl_prototype_enabled: true
  sscl_prototype_momentum: 0.99
  sscl_prototype_min_samples: 1
  sscl_prototype_max_slots: 2
  sscl_prototype_multi_slot_classes: [0, 1, 2, 3]
  sscl_prototype_group_pairs: [[0, 1], [2, 3]]
  sscl_prototype_group_weight: 1.5
  sscl_projection_enabled: true
  sscl_projection_dim: 128
  sscl_prototype_instance_pos: true

  # --- 明确关闭本轮不做的机制 ---
  sscl_distill_enabled: false
  sscl_distill_lambda: 0.5
  sscl_distill_temperature: 2.0
  sscl_distill_mode: mse
  sscl_teacher_checkpoint: null
  sscl_protected_classes: null
  sscl_hard_neg_enabled: false
  sscl_hard_neg_topk: 3
  sscl_hard_neg_score_thresh: -2.0
  sscl_hard_neg_log_interval: 100
  class_balance_enabled: false
  logit_adjustment_enabled: false
test:
  dataset: shwx
  checkpoint: output/0812-SHWX-SSCL-MultiProto-v1/checkpoint_best_total.pth
  conf_threshold: 0.25                 # 全局置信度阈值
  class_conf_thresholds: {}            # 逐类阈值 {类别id: 阈值}；可整段贴入 calibrate_thresholds 产物
  device: cuda:0                       # 无 CUDA 时自动回退 CPU
  batch_size: 32                       # GPU 单次前向图像数
  num_workers: 12                      # CPU 预取 worker 数
  prefetch_factor: 3
  gpu_util_sample_interval: 0.5
  use_fp16: false
  save_fp_fn: true                     # 保存 FP/FN 可视化
  save_yolo_preds: false               # 输出 YOLO 格式预测框（供归因/探针脚本复用）