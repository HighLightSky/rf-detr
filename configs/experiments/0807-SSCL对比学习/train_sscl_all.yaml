# SSCL 全类别实验（等价旧 src/scripts/train_sscl_all.py）
# 从发布权重（DINOv2 预训练）全量微调 100 epoch，第 30 轮起对全部 25 类施加 SSCL。
# 用法: python src/scripts/train.py -c configs/experiments/train_sscl_all.yaml
model:
  variant: medium
  num_classes: 25
  resolution: 640 # 旧脚本显式 640
  gradient_checkpointing: true
  # 不写 pretrain_weights = 使用官方发布权重（DINOv2 backbone + COCO decoder）

train:
  dataset_dir: /home/liu/datasets/SHWX-dataset-dict
  dataset_file: yolo
  output_dir: output/0802-SHWX-rfdetr_medium_SSCL-all
  epochs: 100
  batch_size: 8
  grad_accum_steps: 4 # 有效 batch = 32
  num_workers: 12
  lr: 1e-4
  lr_encoder: 1.5e-4
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 40
  warmup_epochs: 3.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 5
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.8 # 从预训练全量训练，保留 Mosaic
  multi_scale: true # 保留多尺度
  # --- SSCL 配置（全类别：anchor/confusing 为 null）---
  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx.pt
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.01
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: null # null=全部 25 类作为 anchor
  sscl_confusing_classes: null
  sscl_start_epoch: 30 # 前 30 轮仅常规损失
  sscl_freeze_strategy: none # 从预训练直接训练：不冻结
  sscl_prototype_enabled: true
  sscl_prototype_momentum: 0.99
  sscl_prototype_min_samples: 1
  sscl_projection_enabled: true
  sscl_projection_dim: 128
  sscl_prototype_instance_pos: true
  sscl_distill_enabled: false # 从 COCO 起步没有合理 SHWX teacher
