# E2：小样本 SSCL + 多原型 + 仅评估/推理侧视觉原型 logit 校准
# 目的：验证视觉原型是否包含可直接改善小样本分类决策的判别证据。
# E2 关闭投影头，让训练特征、视觉原型和推理校准处在同一 decoder 特征空间。
# 用法: python src/scripts/train.py -c configs/experiments/SSCL-有效性消融/train_E2_rare_sscl_protologit_1024.yaml
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  pretrain_weights: output/0813-SHWX-rfdetr-medium-baseline-精细标注/checkpoint_best_total.pth

  # 只在 eval/推理时校准小样本船舶类别：HM、LQS、QHS。
  prototype_logit_enabled: true
  prototype_logit_target_classes: [0, 1, 2]
  prototype_logit_max_slots: 2
  prototype_logit_alpha: 0.05
  prototype_logit_margin: 0.05
  prototype_logit_temperature: 0.1

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/0813-强基线-多原型/SSCL有效性消融-E2-rare-SSCL-ProtoLogit-1024
  epochs: 18
  batch_size: 16
  grad_accum_steps: 4
  num_workers: 6
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 18
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false

  # 与 E1/E0 保持一致。
  class_balanced_sampling: true
  class_balanced_threshold: null
  class_balanced_class_ids: [0, 1]

  # 训练侧 SSCL 仍只服务小样本 anchor。
  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx.pt
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.01
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: [0, 1, 2]
  sscl_confusing_classes: [0, 1, 2, 3]
  sscl_start_epoch: 0
  sscl_freeze_strategy: conservative
  sscl_unfreeze_decoder_layers: 2

  sscl_prototype_enabled: true
  sscl_prototype_momentum: 0.99
  sscl_prototype_min_samples: 1
  sscl_prototype_max_slots: 2
  sscl_prototype_multi_slot_classes: [0, 1, 2]
  sscl_prototype_group_pairs: [[0, 1], [2, 3]]
  sscl_prototype_group_weight: 1.1
  sscl_projection_enabled: false
  sscl_projection_dim: 128
  sscl_prototype_instance_pos: true

  # 暂不加入难例抑制，单独验证原型校准。
  sscl_hard_neg_enabled: false
  sscl_hard_neg_topk: 3
  sscl_hard_neg_score_thresh: 0.0
  sscl_hard_neg_log_interval: 100
  sscl_hard_neg_target_classes: [2]
  sscl_hard_neg_iou_low: 0.0
  sscl_hard_neg_iou_high: 0.10
  sscl_hard_neg_loss_lambda: 0.05
  sscl_hard_neg_logit_margin: -1.5
  sscl_hard_neg_logit_temperature: 1.0
  sscl_hard_neg_proto_lambda: 0.0
  sscl_hard_neg_proto_margin: 0.1
  sscl_hard_neg_proto_temperature: 0.1

  sscl_distill_enabled: false
  sscl_distill_lambda: 0.5
  sscl_distill_temperature: 2.0
  sscl_distill_mode: mse
  sscl_teacher_checkpoint: null
  sscl_protected_classes: null
  class_balance_enabled: false
  logit_adjustment_enabled: false

test:
  dataset: shwx
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  resolution: 1024
  checkpoint: output/0813-强基线-多原型/SSCL有效性消融-E2-rare-SSCL-ProtoLogit-1024/checkpoint_best_total.pth
  output_dir: output/0813-强基线-多原型/SSCL有效性消融-E2-rare-SSCL-ProtoLogit-1024
  conf_threshold: 0.25
  class_conf_thresholds: {}
  device: cuda:0
  batch_size: 16
  num_workers: 6
  prefetch_factor: 3
  gpu_util_sample_interval: 0.5
  use_fp16: false
  save_fp_fn: true
  save_yolo_preds: false
