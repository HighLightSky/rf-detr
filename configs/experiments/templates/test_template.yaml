# ============================================================================
# RF-DETR 统一测试评估配置模板
# 用法: python src/scripts/test.py -c configs/experiments/templates/test_template.yaml
# 建议: 复制为 test_<实验名>.yaml 再修改
# ============================================================================
test:
  dataset: shwx # 内置名（eval_lib.DATASET_CONFIGS）：shwx / dior；省略默认 shwx
  dataset_dir:
    /home/liu/wzt/datasets/SHWX-dataset-dict
    # 数据集根目录（同训练侧 dataset_dir 配置模式）；省略=内置默认。
    # 重新标注后数据路径变化时在此覆盖，类别语义仍由 dataset 内置配置提供
  resolution:
    704 # 推理输入分辨率（须与训练分辨率一致，如 nano 704 训练时填 704）；
    # 省略=使用 checkpoint 记录的分辨率
  checkpoint:
    output/xxxx-SHWX-实验名/checkpoint_best_total.pth
    # 相对项目根路径；省略则用数据集配置默认（exp_output_dir / checkpoint_file）
  output_dir: output/xxxx-SHWX-实验名 # 测试输出目录（报告/混淆矩阵/FP·FN）；省略=数据集内置 exp_output_dir
  conf_threshold: 0.25 # 全局置信度阈值
  class_conf_thresholds: {} # 逐类阈值 {类别id: 阈值}
    # 可整段贴入 calibrate_thresholds 输出的 calibrated_thresholds.json
  device: cuda:0 # 无 CUDA 时自动回退 CPU
  batch_size: 32 # GPU 单次前向图像数（越大 GPU 利用率越高）
  num_workers: 12 # CPU 预取 worker 数
  prefetch_factor: 3
  gpu_util_sample_interval: 0.5
  use_fp16: false # FP16 推理加速（对精度敏感时保持 false）

  # 推理侧 Logit Adjustment（P1 配套，须与训练侧参数一致）
  la_bias: # 省略 / 置 null = 关闭
    counts_path: output/xxxx-SHWX-实验名/class_counts.json
    k: 1.0 # 推理侧扣减系数（0/0.5/1）
    tau: 0.1 # 与训练侧 logit_adjustment_tau 一致
    clip: 1.0 # 与训练侧 logit_adjustment_bias_clip 一致
    beta: 0.25 # 与训练侧 class_balance_beta 一致
    max_weight: 3.0 # 与训练侧 class_balance_max_weight 一致
    min_count: 10
    ref_count: null
    target_classes: null

  save_fp_fn: true # 保存 FP/FN 可视化到实验目录
  save_yolo_preds: false # 输出 YOLO 格式预测框（供归因/探针脚本复用）
