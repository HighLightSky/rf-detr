# ============================================================================
# RF-DETR 统一推理配置模板
# 用法: python src/scripts/predict.py -c configs/experiments/templates/predict_template.yaml
# 建议: 复制为 predict_<实验名>.yaml 再修改
# ============================================================================
predict:
  checkpoint: output/xxxx-SHWX-实验名/checkpoint_best_total.pth # 相对项目根
  conf: 0.25 # 置信度阈值
  output_dir: output/xxxx-SHWX-实验名/predict # 输出 labels/ + visualization/
  image: /path/to/image_or_folder # 输入图片或目录，必须设置
  class_names: shwx # 类别名来源：内置名 shwx/dior，或 {label: 名称} 字典
  label_comparison:
    enabled: false # 开启后输出标签与预测对比图，FP/FN 用红色标记
    labels_dir: /path/to/yolo/labels # YOLO 标签目录，enabled=true 时必须设置
    iou_threshold: 0.50 # 同类别预测与标签匹配阈值
  reason_plugin:
    enabled: false # 默认关闭；仅改为 true 时启用插件
    checkpoint: null # 插件 checkpoint 路径，例如 output/reason_plugin.pth
    class_ids: [24] # 需要重打分的类别；null 表示全部类别
    conf_low: null # 候选框下限；null 使用插件 checkpoint 内置值
