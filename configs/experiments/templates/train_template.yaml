# ============================================================================
# RF-DETR 统一训练配置模板
# 用法: python src/scripts/train.py -c configs/experiments/templates/train_template.yaml
# 建议: 复制本文件为 train_<实验名>.yaml 再修改，不要直接改模板
# ============================================================================

# --- 模板专用键（train.py 消费，不会传给 model.train）---
_template:
  class_counts: auto   # auto=训练前统计类别数写 <output_dir>/class_counts.json
                       #   并自动注入 class_balance_counts_path（P0 类均衡数据准备）
                       # off/省略=关闭自动统计

# --- 模型构造参数（RFDETR 变体类 kwargs 全部透传）---
model:
  variant: medium      # 模板专用键: nano/small/medium/large/large_deprecated
                       #   large=新版 RFDETRLarge(768)，large_deprecated=旧版(560)
  num_classes: 25      # 类别数（SHWX=25, DIOR=20）
  resolution: 640      # 输入分辨率；不写则用变体默认（nano 384/small 512/medium 576/
                       #   large 704/large_deprecated 560），旧实验脚本显式写 640
  gradient_checkpointing: true   # 用计算换显存（backbone 激活值不缓存）
  # freeze_encoder: false        # 冻结 backbone（LoRA 实验用 true）
  # backbone_lora: true          # 注入 LoRA/DoRA 适配器（须配合 freeze_encoder=true）
  # pretrain_weights: output/0805-.../checkpoint_best_total.pth
  #   # 微调起点 checkpoint（相对项目根）；不写 = 官方发布权重

# --- 训练参数（100% 透传为 model.train(**kwargs)，键名即 TrainConfig 字段）---
train:
  # ── 数据集 ─────────────────────────────────────────────────────
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict
  dataset_file: yolo               # yolo/coco/roboflow
  # ── 训练超参 ───────────────────────────────────────────────────
  output_dir: output/xxxx-SHWX-实验名
  epochs: 6
  batch_size: 32                   # 每 GPU batch size
  grad_accum_steps: 2              # 有效 batch = batch_size * grad_accum_steps
  num_workers: 12
  lr: 1e-5                         # 解码器学习率（短微调用 1e-5，全量用 1e-4）
  lr_encoder: 1e-5                 # backbone 学习率
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 6                       # 步长衰减 epoch；短训练写 max(1, epochs) 保持恒定 LR
  warmup_epochs: 0.0
  # ── 数据增广 ───────────────────────────────────────────────────
  aug_config: AERIAL               # 预设名: AERIAL/CONSERVATIVE/AGGRESSIVE/INDUSTRIAL/none
  mosaic_p: 0.0                    # Mosaic 概率（微调 0.0，全量 0.5~0.8）
  multi_scale: false               # 多尺度训练（全量开，SSCL 微调关）
  # 平方根频率过采样（MMDetection ClassBalancedDataset 风格）
  # class_balanced_sampling: true
  # class_balanced_threshold: null
  # class_balanced_class_ids: [0, 1]
  # ── 硬件 / 日志 ────────────────────────────────────────────────
  device: cuda
  devices: 1
  num_nodes: 1
  tensorboard: true
  wandb: false
  # ── EMA / 验证 / 恢复 ──────────────────────────────────────────
  use_ema: true
  eval_interval: 1
  compute_val_loss: false          # 关闭验证 loss 计算省显存
  resume: ""                       # last.ckpt 路径（相对项目根）实现续训
  # ── 缓存（加速训练）──
  # dataset_cache_mode: raw
  # dataset_cache_dir: null
  # dataset_cache_rebuild: false
  # ── DataLoader 调优 ────────────────────────────────────────────
  # persistent_workers: true
  # prefetch_factor: 4
  # pin_memory: true

  # ── SSCL 语义对比学习 ──────────────────────────────────────────
  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx.pt   # 相对项目根
  sscl_matrix_normalize: minmax    # minmax/softmax/none
  sscl_lambda: 0.03                # SSCL 损失权重 λ
  sscl_tau: 0.1                    # 对比学习温度 τ
  sscl_rho: 0.3                    # 语义先验放大系数 ρ
  sscl_omega_max: 2.0              # 负样本语义权重上限
  sscl_anchor_classes: [0, 1, 2, 3]   # 参与计算 sscl 损失的类别；null=全部
  sscl_confusing_classes: [0, 1, 2, 3]  # 参与充当比较类别的类别；null=全部
  sscl_start_epoch: 0              # 微调从 0 启用；全量可设 30
  sscl_freeze_strategy: conservative  # conservative/none
  sscl_unfreeze_decoder_layers: 1   # conservative 下解冻 decoder 末尾层数；1=旧行为
  # --- 原型库 + 投影头 ---
  sscl_prototype_enabled: true
  sscl_prototype_momentum: 0.99
  sscl_prototype_min_samples: 1
  # --- 多 slot 原型（v1：只给 HM/LQS/QHS/MS 开 2 slot，同组 sibling 负样本额外加压）---
  # sscl_prototype_max_slots: 2
  # sscl_prototype_multi_slot_classes: [0, 1, 2, 3]
  # sscl_prototype_group_pairs: [[0, 1], [2, 3]]
  # sscl_prototype_group_weight: 1.5
  sscl_projection_enabled: true
  sscl_projection_dim: 128
  sscl_prototype_instance_pos: true   # 实例正样本锚定冷启动
  # --- 基类蒸馏 ---
  sscl_distill_enabled: false
  sscl_distill_lambda: 0.5
  sscl_distill_temperature: 2.0
  sscl_distill_mode: mse
  sscl_teacher_checkpoint: null    # 蒸馏开启时填 checkpoint 路径
  sscl_protected_classes: null
  # --- 难例负样本 ---
  sscl_hard_neg_enabled: false
  sscl_hard_neg_topk: 3
  sscl_hard_neg_score_thresh: -2.0
  sscl_hard_neg_log_interval: 100

  # ── P0 正样本类均衡 IA-BCE（注意与上方 class_balanced_* 区分！）──
  class_balance_enabled: false
  class_balance_beta: 0.25
  class_balance_max_weight: 3.0
  class_balance_min_count: 10
  class_balance_ref_count: null    # null=自动取 sqrt(N_max*N_min)
  class_balance_target_classes: [0, 1]
  # class_balance_counts_path 由 _template.class_counts=auto 自动注入

  # ── P1 居中截断 Logit Adjustment ───────────────────────────────
  logit_adjustment_enabled: false
  logit_adjustment_tau: 0.1
  logit_adjustment_bias_clip: 1.0
  logit_adjustment_warmup_epochs: 1.0

  # ── 语义头 / QNorm 模块 ────────────────────────────────────────
  # qnorm_obj_enabled: true
  # semantic_head_enabled: false
  # semantic_fsem_path: data/fsem_shwx.pt
  # semantic_channel_stats_path: data/channel_stats_shwx.pt
  # semantic_alpha_init: 0.1
  # semantic_novel_classes: [0, 1, 2, 3]

# 提示：新增 TrainConfig 字段（src/rfdetr/config.py）后直接在 train: 段加键即可，
# 无需改任何代码。键拼写错误会由 TrainConfig extra="forbid" 报出具体字段。
