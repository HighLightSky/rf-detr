# [ProtoGuidance] E2：E1 + 原型分类辅助损失（loss_proto_labels_enc，防 no-op 主武器）
# 预期：topk_overlap 下行至 0.85-0.95、proto_selected_ratio>0.05、target_recall_enc 上行、
# loss_proto_labels_enc 持续下降、proj_token 等参数梯度范数 >0。
# 决策规则：E2 收敛后若 topk_overlap 仍 >0.95 → lambda_pos_max 提至 2.0 / tau_p 至 0.2 重跑。
# 用法: python src/scripts/train.py -c configs/experiments/proto_guidance_E2.yaml
model:
  variant: medium
  num_classes: 25
  resolution: 640
  gradient_checkpointing: true
  # 从不含塌缩 ProtoGuidance 状态的 detector baseline 启动
  pretrain_weights: output/0813-SHWX-rfdetr-medium-baseline-精细标注/checkpoint_best_total.pth
  # --- 多模态原型引导：位置 + 辅助损失 ---
  proto_guidance_enabled: true
  proto_guidance_artifacts_path: data/proto_guidance_shwx.pt
  proto_guidance_fusion_mode: simple
  proto_guidance_num_slots: 10
  proto_guidance_position_enabled: true
  proto_guidance_content_enabled: false
  proto_guidance_aux_loss_enabled: true
  proto_guidance_aux_loss_weight: 1.0
  proto_guidance_warmup_epochs: 2.0
  proto_guidance_lambda_pos_init: 0.05
  proto_guidance_lambda_pos_max: 3.0  # v2增强
  proto_guidance_tau_p: 0.2  # v2增强，按 cosine / tau_p 缩放

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/0815-SHWX-ProtoGuidance-E2-fixed-SSCL
  epochs: 18
  batch_size: 32
  grad_accum_steps: 2
  num_workers: 12
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 18
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false
  class_balanced_sampling: true
  class_balanced_class_ids: [0, 1]
  sscl_freeze_strategy: conservative
  sscl_unfreeze_decoder_layers: 2

    # --- SSCL 配置：沿用 0812 multproto 量级（E4 引入，负责 decoder 后判别） ---
  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx.pt
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.02
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: [0, 1, 2, 3]
  sscl_confusing_classes: [0, 1, 2, 3]
  sscl_start_epoch: 0
  # 当前 E4 只验证 instance-to-instance SSCL；不把它误称为 SSCL 视觉原型实验
  sscl_prototype_enabled: false
