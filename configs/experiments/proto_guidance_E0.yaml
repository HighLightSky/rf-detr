# [ProtoGuidance] E0：对照基线（无原型引导、无 SSCL），与 E1-E4 同基底
# 记录：整体 mAP/AP50/recall + FSC/HM/LQS/QHS/MS 逐类 AP 与 recall。
# 用法: python src/scripts/train.py -c configs/experiments/proto_guidance_E0.yaml
model:
  variant: medium
  num_classes: 25
  resolution: 640
  gradient_checkpointing: true
  pretrain_weights: output/0805-SHWX-data-expand-rfdetr-baseline/checkpoint_best_total.pth

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/0814-SHWX-ProtoGuidance-E0
  epochs: 18
  batch_size: 32
  grad_accum_steps: 2
  num_workers: 12
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 18
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false
  class_balanced_sampling: true
  class_balanced_class_ids: [0, 1]
  sscl_freeze_strategy: conservative
  sscl_unfreeze_decoder_layers: 2
