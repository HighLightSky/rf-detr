# 阶段五候选：飞机混淆对；pairwise margin loss 尚未实现，禁止直接运行
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  pretrain_weights: output/proto_guidance_alignment_repair/12_dense_ce_lse_slots/checkpoint_best_total.pth
  proto_guidance_enabled: true
  proto_guidance_artifacts_path: data/proto_guidance_shwx_1024_current.pt
  proto_guidance_position_enabled: false
  proto_guidance_content_enabled: false
  proto_guidance_dense_loss_enabled: true
  proto_guidance_dense_loss_weight: 1.0
train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/proto_guidance_alignment_repair/32_dense_hardneg_aircraft_pairs
  epochs: 5
  batch_size: 16
  grad_accum_steps: 4
  num_workers: 6
  lr: 1e-5
  lr_encoder: 1e-5
  eval_interval: 1
  use_ema: true
  aug_config: AERIAL
  mosaic_p: 0.0
  sscl_freeze_strategy: conservative
  proto_guidance_freeze_all_except_proto: true
  proto_guidance_trainable_scope: all
