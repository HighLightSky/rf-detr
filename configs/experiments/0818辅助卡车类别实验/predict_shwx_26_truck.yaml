# 26 类 truck 推理配置。
# 用法：python src/scripts/predict.py -c configs/experiments/0818辅助卡车类别实验/predict_shwx_26_truck.yaml
predict:
  checkpoint: output/0820-SHWX-ProtoGuidance-E4-hardneg-fsc-26class-truck/checkpoint_best_total.pth
  conf: 0.25
  output_dir: output/0820-SHWX-ProtoGuidance-E4-hardneg-fsc-26class-truck-predict
  image: null # 输入图片或目录，运行前必须填写
  class_names: shwx_truck
  label_comparison:
    enabled: false # 开启后输出标签与预测对比图，FP/FN 用红色标记
    labels_dir: null # YOLO 标签目录，enabled=true 时必须设置
    iou_threshold: 0.50 # 同类别预测与标签匹配阈值
  reason_plugin:
    enabled: false
    checkpoint: null
    class_ids: [24]
    conf_low: null
