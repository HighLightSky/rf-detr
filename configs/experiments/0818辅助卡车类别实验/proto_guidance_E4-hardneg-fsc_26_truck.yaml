# SHWX 26 类 E4：在 26 类基线基础上加入多模态原型与难负样本抑制。
# truck=25 是显式普通军用卡车；FSC=24 保持原类别索引。
# 前置：先完成 120 epoch 基线，再生成两个离线产物：
#   RFDETR_PROTO_DATASET=shwx_truck RFDETR_PROTO_NUM_CLASSES=26 \
#   RFDETR_PROTO_DATASET_DIR=/home/liu/wzt/datasets/SHWX-dataset-dict-redo-truck \
#   RFDETR_PROTO_RESOLUTION=1024 \
#   RFDETR_PROTO_CHECKPOINT=output/0818-SHWX-medium-baseline-26class-truck-1024/checkpoint_best_total.pth \
#   RFDETR_PROTO_OUTPUT=data/proto_guidance_shwx_truck_26.pt \
#   python src/scripts/semantic_experiments/stage0_build_proto_guidance.py
# 用法：python src/scripts/train.py -c configs/experiments/proto_guidance_E4-hardneg-fsc_26_truck.yaml
model:
  variant: medium
  num_classes: 26
  resolution: 1024
  gradient_checkpointing: true
  pretrain_weights: output/0818-SHWX-medium-baseline-26class-truck-1024/checkpoint_best_total.pth
  proto_guidance_enabled: true
  proto_guidance_artifacts_path: data/proto_guidance_shwx_truck_26.pt
  proto_guidance_fusion_mode: simple
  proto_guidance_num_slots: 10
  proto_guidance_position_enabled: true
  proto_guidance_content_enabled: true
  proto_guidance_aux_loss_enabled: true
  proto_guidance_aux_loss_weight: 1.0
  proto_guidance_warmup_epochs: 2.0
  proto_guidance_lambda_pos_init: 0.05
  proto_guidance_lambda_pos_max: 1.0
  proto_guidance_gamma_content_init: 0.05
  proto_guidance_gamma_content_max: 1.0
  proto_guidance_tau_p: 0.2

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-truck
  dataset_file: yolo
  output_dir: output/0820-SHWX-ProtoGuidance-E4-hardneg-fsc-26class-truck
  epochs: 20
  batch_size: 32
  grad_accum_steps: 2
  num_workers: 6
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 16
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false
  class_balanced_sampling: true
  class_balanced_class_ids: [0, 1, 24, 25]

  # 补丁粘贴
  patch_paste_enabled: true
  patch_paste_dir: data/fsc_patch_pool   # 由 build_fsc_patch_pool.py 生成
  patch_paste_prob: 0.5
  patch_paste_max_patches: 2
  patch_paste_target_classes: [24]       # 宿主约束：只贴到含发射车的图
  patch_paste_neg_ratio: 0.5

  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx_truck_26.pt
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.02
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: [0, 1, 2, 3]
  sscl_confusing_classes: [0, 1, 2, 3]
  sscl_start_epoch: 0
  sscl_freeze_strategy: conservative
  sscl_unfreeze_decoder_layers: 2
  sscl_prototype_enabled: false

  # 难负样本仍针对原有高风险类别；truck 由显式类别监督学习。
  sscl_hard_neg_enabled: true
  sscl_hard_neg_topk: 5
  sscl_hard_neg_score_thresh: -0.7
  sscl_hard_neg_log_interval: 100
  sscl_hard_neg_target_classes: [0, 1, 2, 24]
  sscl_hard_neg_iou_low: 0.0
  sscl_hard_neg_iou_high: 0.15
  sscl_hard_neg_loss_lambda: 0.3
  sscl_hard_neg_logit_margin: -1.5
  sscl_hard_neg_target_logit_margins: {24: -2.5}
  sscl_hard_neg_target_loss_lambdas: {24: 0.15}
  sscl_hard_neg_logit_temperature: 1.0
  sscl_hard_neg_proto_lambda: 0.05
  sscl_hard_neg_proto_margin: 0.1
  sscl_hard_neg_proto_temperature: 0.1

test:
  dataset: shwx_truck
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-truck
  resolution: 1024
  checkpoint: output/0820-SHWX-ProtoGuidance-E4-hardneg-fsc-26class-truck/checkpoint_best_total.pth
  output_dir: output/0820-SHWX-ProtoGuidance-E4-hardneg-fsc-26class-truck-eval
  conf_threshold: 0.25
  class_conf_thresholds: {}
  device: cuda:0
  batch_size: 32
  num_workers: 12
  prefetch_factor: 3
  gpu_util_sample_interval: 0.5
  use_fp16: false
  save_fp_fn: true
  save_yolo_preds: true
