# [ProtoGuidance] 联合训练阶段二（20ep）：位置升满 + SSCL 全量 + 难负样本晚开
# 衔接阶段一 joint120 的 EMA best checkpoint。
# 设计要点：
#   - λ→1.0（位置升满；E2 曾证 λmax=3.0 更优，本轮 1.0 起步，后续可升）、
#     γ 维持 0.3（内容继续压着验证，收益小时砍掉它就有了依据）；
#   - SSCL λ=0.02 从 ep0 继续（阶段一已有 ~100ep 积累），freeze=conservative
#     与 E 系列一致，保证 20ep 阶段数字可比；
#   - 难负样本抑制 ep10 才启动（sscl_hard_neg_start_epoch 独立门控），λ 减半
#     0.15、logit margin 放宽 -2.0、目标集排除 MS（吸取 E4-hard-neg -22pt 教训）；
#   - 调度修复：lr_drop=14（2/3 处 10x 衰减，最后 1/3 退火；E4 的 lr_drop=18==
#     epochs 导致从不衰减），train warmup 1ep。
# 用法: python src/scripts/train.py -c configs/experiments/proto_guidance_joint20.yaml
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  pretrain_weights: output/0815-SHWX-ProtoGuidance-joint120-1024/checkpoint_best_total.pth
  # --- 多模态原型引导：位置升满，内容维持弱注入 ---
  proto_guidance_enabled: true
  proto_guidance_artifacts_path: data/proto_guidance_shwx.pt
  proto_guidance_fusion_mode: simple
  proto_guidance_num_slots: 10
  proto_guidance_position_enabled: true
  proto_guidance_content_enabled: true
  proto_guidance_aux_loss_enabled: true
  proto_guidance_aux_loss_weight: 0.3
  proto_guidance_warmup_epochs: 2.0
  proto_guidance_lambda_pos_init: 0.05
  proto_guidance_lambda_pos_max: 1.0
  proto_guidance_gamma_content_init: 0.05
  proto_guidance_gamma_content_max: 0.3
  proto_guidance_tau_p: 0.2

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/0815-SHWX-ProtoGuidance-joint20-1024
  epochs: 20
  batch_size: 8
  grad_accum_steps: 8 # 有效 batch = 64
  num_workers: 6
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 14 # 最后 1/3 退火（修复 E4 从不衰减的缺陷）
  warmup_epochs: 1.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false
  class_balanced_sampling: true
  class_balanced_class_ids: [0, 1]

  # --- SSCL：阶段一延续，λ 回到 0.02 ---
  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx.pt
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.02
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: [0, 1, 2, 3]
  sscl_confusing_classes: [0, 1, 2, 3]
  sscl_start_epoch: 0
  sscl_freeze_strategy: conservative # 与 E 系列一致（backbone/encoder 冻结，末 2 层 decoder + class_embed + proto 可训）
  sscl_unfreeze_decoder_layers: 2
  sscl_prototype_enabled: false

  # --- 难负样本抑制 v2：晚启动 + 减量 + 排除 MS ---
  sscl_hard_neg_enabled: true
  sscl_hard_neg_topk: 5
  sscl_hard_neg_score_thresh: -0.7
  sscl_hard_neg_log_interval: 100
  sscl_hard_neg_target_classes: [0, 1, 2] # 排除 MS(3)，民船不抑制
  sscl_hard_neg_iou_low: 0.0
  sscl_hard_neg_iou_high: 0.15
  sscl_hard_neg_loss_lambda: 0.15 # 0.3 → 0.15 减半
  sscl_hard_neg_logit_margin: -2.0 # -1.5 → -2.0 放宽
  sscl_hard_neg_logit_temperature: 1.0
  sscl_hard_neg_proto_lambda: 0.05
  sscl_hard_neg_proto_margin: 0.1
  sscl_hard_neg_proto_temperature: 0.1
  sscl_hard_neg_start_epoch: 10 # ep10 才启动（独立门控，与 SSCL 解耦）
