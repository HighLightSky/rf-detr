# ProtoGuidance 对齐修复：1024 基线
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  pretrain_weights: output/0816在120ep1024基础上续训多模态原型-效果最好/0816-SHWX-ProtoGuidance-E4-hardneg-fsc-次好-当前最佳/checkpoint_best_total.pth
  proto_guidance_enabled: false

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/proto_guidance_alignment_repair/00_baseline_1024
  epochs: 5
  batch_size: 8
  grad_accum_steps: 8
  num_workers: 6
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 4
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: true
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false
  sscl_freeze_strategy: none
