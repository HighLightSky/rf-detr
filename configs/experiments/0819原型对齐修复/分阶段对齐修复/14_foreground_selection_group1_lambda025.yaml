# ProtoGuidance 前景 selection：使用已训练 foreground head，lambda=0.25
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  group_detr: 1
  gradient_checkpointing: true
  pretrain_weights: output/proto_guidance_alignment_repair/13_dense_foreground_group1/last_ema.pth
  proto_guidance_enabled: true
  proto_guidance_artifacts_path: data/proto_guidance_shwx_1024_current.pt
  proto_guidance_fusion_mode: simple
  proto_guidance_num_slots: 10
  proto_guidance_position_enabled: true
  proto_guidance_content_enabled: false
  proto_guidance_dense_loss_enabled: true
  proto_guidance_dense_loss_weight: 1.0
  proto_guidance_dense_foreground_loss_enabled: true
  proto_guidance_dense_foreground_loss_weight: 1.0
  proto_guidance_dense_background_ratio: 1.0
  proto_guidance_position_score_mode: foreground
  proto_guidance_lambda_pos_init: 0.05
  proto_guidance_lambda_pos_max: 0.25
  proto_guidance_warmup_epochs: 2.0
  proto_guidance_dense_iou_pos: 0.3
  proto_guidance_dense_iou_ignore: 0.1
  proto_guidance_dense_center_fallback_topk: 4
  proto_guidance_slot_reduction: lse
  proto_guidance_slot_reduction_tau: 0.1
  proto_guidance_tau_p: 0.2

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/proto_guidance_alignment_repair/14_foreground_selection_group1_lambda025
  epochs: 5
  batch_size: 16
  grad_accum_steps: 4
  num_workers: 2
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 4
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: true
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false
  sscl_freeze_strategy: conservative
  proto_guidance_freeze_all_except_proto: true
  proto_guidance_trainable_scope: token_fg
