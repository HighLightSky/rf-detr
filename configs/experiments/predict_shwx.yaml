# SHWX 单图/批量推理配置
# 用法:
#   python src/scripts/predict.py -c configs/experiments/predict_shwx.yaml --image /path/to/image.jpg
#   python src/scripts/predict.py -c configs/experiments/predict_shwx.yaml --image /path/to/folder --conf 0.3
predict:
  checkpoint: output/0807-SHWX-SSCL-Proj-原型+实例正样本/checkpoint_best_total.pth
  # 相对项目根路径
  conf: 0.25
  output_dir: output/0807-SHWX-SSCL-Proj-原型+实例正样本/predict
  image: null # 通常由 --image 命令行提供；也可在此给默认
  class_names: shwx # 类别名来源：内置名 shwx/shwx_truck/dior，或 {label: 名称} 字典
