# 0813 正交消融 C：只启用难负样本抑制
# 目的：验证未匹配 query 抑制是否单独降低虚警，以及是否独立造成召回下降。
# 注意：难负样本回调挂在 SSCL 入口下，因此 sscl_enabled 保持 true，但 sscl_lambda 设为 0。
# 用法: python src/scripts/train.py -c configs/experiments/train_ablate_0813_hardneg_only_1024.yaml
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  pretrain_weights: output/0813-SHWX-rfdetr-medium-baseline-精细标注/checkpoint_best_total.pth

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/0813-强基线-多原型/ablate-C-hardneg-only-1024
  epochs: 18
  batch_size: 16
  grad_accum_steps: 4
  num_workers: 12
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 18
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false

  # 保持与其他消融组一致。
  class_balanced_sampling: true
  class_balanced_threshold: null
  class_balanced_class_ids: [0, 1]

  # SSCL 本体权重为 0，仅借用回调选择和计算难负样本。
  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx.pt
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.0
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: [0, 1, 2, 3]
  sscl_confusing_classes: [0, 1, 2, 3]
  sscl_start_epoch: 0
  sscl_freeze_strategy: conservative
  sscl_unfreeze_decoder_layers: 2

  # 关闭原型，避免 hard negative 中的原型 repulsion 混入。
  sscl_prototype_enabled: false
  sscl_prototype_momentum: 0.99
  sscl_prototype_min_samples: 1
  sscl_prototype_max_slots: 2
  sscl_prototype_multi_slot_classes: [0, 1, 2, 3]
  sscl_prototype_group_pairs: [[0, 1], [2, 3]]
  sscl_prototype_group_weight: 1.5
  sscl_projection_enabled: true
  sscl_projection_dim: 128
  sscl_prototype_instance_pos: true

  # MS=3 不参与抑制；当前组保留 HM/LQS/QHS，重点观察 QHS FP 与 ship recall。
  sscl_hard_neg_enabled: true
  sscl_hard_neg_topk: 5
  sscl_hard_neg_score_thresh: -0.7
  sscl_hard_neg_log_interval: 100
  sscl_hard_neg_target_classes: [0, 1, 2]
  sscl_hard_neg_iou_low: 0.0
  sscl_hard_neg_iou_high: 0.15
  sscl_hard_neg_loss_lambda: 0.3
  sscl_hard_neg_logit_margin: -1.5
  sscl_hard_neg_logit_temperature: 1.0
  sscl_hard_neg_proto_lambda: 0.0
  sscl_hard_neg_proto_margin: 0.1
  sscl_hard_neg_proto_temperature: 0.1

  sscl_distill_enabled: false
  sscl_distill_lambda: 0.5
  sscl_distill_temperature: 2.0
  sscl_distill_mode: mse
  sscl_teacher_checkpoint: nulld
  sscl_protected_classes: null
  class_balance_enabled: false
  logit_adjustment_enabled: false

test:
  dataset: shwx
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  resolution: 1024
  checkpoint: output/0813-强基线-多原型/ablate-C-hardneg-only-1024/checkpoint_best_total.pth
  output_dir: output/0813-强基线-多原型/ablate-C-hardneg-only-1024
  conf_threshold: 0.25
  class_conf_thresholds: {}
  device: cuda:0
  batch_size: 32
  num_workers: 12
  prefetch_factor: 3
  gpu_util_sample_interval: 0.5
  use_fp16: false
  save_fp_fn: true
  save_yolo_preds: false
