# SHWX 数据集测试评估配置（比赛口径：ship/aircraft IoU=0.50，vehicle=0.35）
# 用法: uv run --no-sync python src/scripts/test.py -c configs/experiments/train_tests/test_shwx.yaml
test:
  dataset: shwx_truck # eval_lib.DATASET_CONFIGS 内置名（shwx/dior）
  dataset_dir: /home/liu/wzt/datasets/SHWX-FINAL-no-FSC-expand-truck
  resolution: 1024
  checkpoint: output/0828发射车虚警抑制/原型前向加难负样本抑制/checkpoint_best_total.pth
  output_dir: output/0828发射车虚警抑制/原型前向加难负样本抑制
  conf_threshold: 0.25 # 全局置信度阈值
  class_conf_thresholds: {} # 逐类阈值 {类别id: 阈值}

  # 民船NMS
  ms_nms:
    enabled: false
    # enabled: tiling_square_stretch
    ms_class_id: 3
    ship_class_ids: [0, 1, 2, 3]
    same_class_iou: 0.80
    same_class_containment: 0.90
    same_class_center_ratio: 0.35
    cross_class_iou: 0.90
    cross_class_containment: 0.95
    cross_class_center_ratio: 0.25
    cross_class_score_margin: 0.05
    keep_ambiguous_cross_class: true

  # 发射车一级候选的 IoU 与包含感知去重。
  fsc_containment_nms:
    enabled: true
    containment_enabled: true
    iou_threshold: 0.5
    containment_threshold: 0.95
    center_ratio_threshold: 0.35

  device: cuda:0 # 无 CUDA 时自动回退 CPU
  batch_size: 8 # GPU 单次前向图像数
  num_workers: 12 # CPU 预取 worker 数
  prefetch_factor: 3
  precision: auto
  compile_model: false
  copy_prefetch: true
  warmup_batches: 1
  progress_interval_s: 1.0
  gpu_monitor_enabled: false

  reason_plugin:
    enabled: false # 默认关闭；仅改为 true 时启用 FFT 一致性插件
    checkpoint: output/0818reasoning-candidate/reason_plugin_fsc.pth # 已训练插件 checkpoint 路径
    class_ids: [24] # 重打分类别；null 表示全部类别
    conf_low: null # 候选框下限；null 使用插件 checkpoint 内置值

  # --- 二阶段 FSC 复核插件（默认关闭）---
  # 启用时先以 candidate_floor 收集 FSC 候选，再按最终 class_conf_thresholds 筛选。
  two_stage:
    enabled: false
    backend: dinov3 # dinov3 / resnet18 / mobilenet_v3_small
    checkpoint: output/0827-0825基线方案/3基线+多模态抑制+SSCL+难例抑制+发射车两阶段/stage2.pth
    backbone_checkpoint: data/dinov3_vit_base_patch16_backbone.pth # DINOv3 头 checkpoint 未自包含 backbone 时必填
    class_ids: [24]
    candidate_floor: 0.05
    context_scale: 2.0
    image_size: 224
    batch_size: 64
    positive_threshold: 0.5 # 二阶段正类概率阈值
    bypass_score: null # 可选：一级高置信框旁路二阶段
    detector_score_weight: 0.0 # 联合门控中一级置信度权重

  save_fp_fn: true # 保存 FP/FN 可视化

  # --- 大图切分（边界检测 → 裁切 → 目标检测 → 映射回原图）---
  large_image_min_side: 2000
  large_image_inference_mode: per_image # mixed：小图与裁窗混合批量；per_image：逐张大图端到端计时

  boundary_checkpoint: output/0827-0825基线方案/2基线+多模态原型+SSCL+难例抑制/onnx/large_cut_boundary_704.onnx
  # boundary_checkpoint: data/large-cut/rf-detr-nano-large-cut.pth
  boundary_resolution: 704 # RF-DETR nano 704
  boundary_conf: 0.25 # 边界框置信度阈值
  detector_conf: 0.25 # 裁窗目标检测置信度阈值
  tiling_padding: 0 # 裁窗外扩像素
  tiling_nms_iou: 0.5 # 边界框 NMS IoU 阈值（0 关闭）
  tiling_square_stretch: false # 边界检测用方形拉伸替代 letterbox
  tiling_batch_size: 8 # 边界检测器 GPU 批量大小
  tiling_num_workers: 4 # 边界检测器预取 worker 数
  max_pending_crops: 128
  roi_backend: auto
  proxy_max_side: 704
  roi_output_size: null
  roi_queue_size: 128
  roi_cache_dir: null
  strict_roi_backend: false
  save_yolo_preds: false # 输出 YOLO 格式预测框（供归因/探针脚本复用）
