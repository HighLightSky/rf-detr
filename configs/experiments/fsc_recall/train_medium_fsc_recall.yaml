# 从固定 medium baseline 续训一级 FSC 检测器。
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  pretrain_weights: output/0825-rfdetr-final-baseline/checkpoint_best_total.pth

train:
  dataset_dir: output/0826-fsc-internal-holdout
  dataset_file: yolo
  output_dir: output/0826-fsc-recall-medium
  epochs: 20
  batch_size: 16
  grad_accum_steps: 4
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true
  lr: 2.0e-5
  lr_encoder: 5.0e-6
  lr_drop: 14
  weight_decay: 1.0e-4
  clip_max_norm: 0.1
  multi_scale: true
  aug_config: AERIAL
  augmentation_backend: kornia
  mosaic_p: 0.1
  class_balanced_sampling: true
  class_balanced_class_ids: [24]
  best_metric: f1
  f1_class_groups: {vehicle: [24]}
  f1_group_iou_thresholds: {vehicle: 0.35}
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  tensorboard: true
  devices: 1
  num_nodes: 1
  seed: 42
