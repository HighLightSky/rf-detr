# [ProtoGuidance] 二三阶段合并：船舶虚警抑制与发射车优化联合微调
# 目标：从 120 轮 detector baseline 直接启动，在同一阶段同时优化船舶和发射车虚警。
# 船舶沿用 E4 强度；FSC 使用更宽松的 margin 和更低的损失权重，降低召回损失风险。
# 用法: python src/scripts/train.py -c configs/experiments/0821尝试调优/多模态对齐二三阶段合并.yaml
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  # 直接从第一阶段 120 轮基线启动，不依赖第二阶段中间权重
  pretrain_weights: output/0815-SHWX-rfdetr-medium-baseline-精细标注-1024/checkpoint_best_total.pth

  # 多模态原型引导：沿用 E4 配方
  proto_guidance_enabled: true
  proto_guidance_artifacts_path: data/proto_guidance_shwx_1024_from120ep.pt
  proto_guidance_fusion_mode: simple
  proto_guidance_num_slots: 10
  proto_guidance_position_enabled: true
  proto_guidance_content_enabled: true
  proto_guidance_dense_loss_enabled: true
  proto_guidance_dense_loss_weight: 0.5
  proto_guidance_dense_foreground_loss_enabled: true
  proto_guidance_dense_foreground_loss_weight: 0.75
  proto_guidance_dense_background_ratio: 1.0
  proto_guidance_position_score_mode: foreground_semantic
  proto_guidance_position_semantic_weight: 0.25
  proto_guidance_position_score_std_ratio: 0.25
  proto_guidance_warmup_epochs: 2.0
  proto_guidance_lambda_pos_init: 0.05
  proto_guidance_lambda_pos_max: 1.0
  proto_guidance_gamma_content_init: 0.05
  proto_guidance_gamma_content_max: 1.0
  proto_guidance_tau_p: 0.2

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/0821-多模态对齐二三阶段合并
  epochs: 20
  batch_size: 32
  grad_accum_steps: 2
  num_workers: 6
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_scheduler: step
  lr_scheduler_kwargs: {lr_drop: 16}
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false

  # 同时提高稀有船舶与发射车样本的抽样概率
  class_balanced_sampling: true
  class_balanced_class_ids: [0, 1, 24]

  # 补丁粘贴仍保持关闭，避免在合并实验中引入额外变量
  patch_paste_enabled: false

  # 基础 SSCL 继续负责船舶细粒度判别
  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx.pt
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.02
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: [0, 1, 2, 3]
  sscl_confusing_classes: [0, 1, 2, 3]
  sscl_start_epoch: 0
  sscl_freeze_strategy: conservative
  sscl_unfreeze_decoder_layers: 2
  sscl_prototype_enabled: false

  # 联合难负样本抑制：船舶使用默认强度，FSC 使用按类弱强度
  sscl_hard_neg_enabled: true
  sscl_hard_neg_topk: 5
  sscl_hard_neg_score_thresh: -0.7
  sscl_hard_neg_log_interval: 100
  sscl_hard_neg_target_classes: [0, 1, 2, 24]
  sscl_hard_neg_iou_low: 0.0
  sscl_hard_neg_iou_high: 0.15
  sscl_hard_neg_loss_lambda: 0.3
  sscl_hard_neg_logit_margin: -1.5
  sscl_hard_neg_target_logit_margins: {24: -2.5}
  sscl_hard_neg_target_loss_lambdas: {24: 0.15}
  sscl_hard_neg_logit_temperature: 1.0
  sscl_hard_neg_proto_lambda: 0.05
  sscl_hard_neg_proto_margin: 0.1
  sscl_hard_neg_proto_temperature: 0.1
