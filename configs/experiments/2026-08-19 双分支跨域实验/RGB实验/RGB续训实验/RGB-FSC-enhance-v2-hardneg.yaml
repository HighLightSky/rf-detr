# RGB 分支从 120 轮基线续训：FSC 保召回、无 FSC 图像抑制虚警
# 评测固定使用全局置信度阈值 0.25，不配置逐类阈值。

_template:
  class_counts: auto

model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  freeze_encoder: false
  pretrain_weights: output/0815-SHWX-rfdetr-medium-baseline-精细标注-1024/checkpoint_best_total.pth
  # 关闭多模态原型，避免历史实验对 FSC 的不稳定干扰。
  proto_guidance_enabled: false

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-full_test
  dataset_file: yolo
  output_dir: output/0821双分支方案/RGB-FSC-enhance-v2-hardneg
  epochs: 20
  batch_size: 32
  grad_accum_steps: 2
  num_workers: 6
  lr: 5e-6
  lr_encoder: 1e-6
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 14
  checkpoint_interval: 1
  warmup_epochs: 0.0
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  seed: 42
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false

  # 只对 FSC 图像做平方根频率过采样，保持飞机和船舶采样分布不变。
  class_balanced_sampling: true
  class_balanced_class_ids: [24]

  # 启用 SSCL 外壳仅为了复用难例抑制回调；对比损失本身关闭。
  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx.pt
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.0
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: [24]
  sscl_confusing_classes: [24]
  sscl_start_epoch: 999
  sscl_freeze_strategy: conservative
  sscl_unfreeze_decoder_layers: 2
  sscl_prototype_enabled: false
  sscl_projection_enabled: false
  sscl_prototype_instance_pos: false

  # 只抑制当前图像没有 FSC 标注的未匹配高分 query，避免压低 FSC 真阳。
  sscl_hard_neg_enabled: true
  sscl_hard_neg_selection_mode: class_balanced
  sscl_hard_neg_class_quota: 1
  sscl_hard_neg_require_class_absent: true
  sscl_hard_neg_topk: 3
  sscl_hard_neg_score_thresh: -1.0
  sscl_hard_neg_log_interval: 100
  sscl_hard_neg_target_classes: [24]
  sscl_hard_neg_iou_low: 0.0
  sscl_hard_neg_iou_high: 0.15
  sscl_hard_neg_loss_lambda: 0.15
  # FSC 使用较宽松的软上界，优先保住召回；抑制只作用于无 FSC 图像。
  sscl_hard_neg_logit_margin: -1.8
  sscl_hard_neg_target_logit_margins: {24: -1.8}
  sscl_hard_neg_target_loss_lambdas: {24: 1.0}
  sscl_hard_neg_logit_temperature: 1.0
  sscl_hard_neg_proto_lambda: 0.0
  sscl_hard_neg_start_epoch: 4

  # 关闭额外的分类先验校准，避免改变飞机类和固定阈值下的分数分布。
  class_balance_enabled: false
  logit_adjustment_enabled: false
