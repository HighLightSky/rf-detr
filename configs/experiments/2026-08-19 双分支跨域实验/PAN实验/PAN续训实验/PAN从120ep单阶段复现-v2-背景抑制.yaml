# 从 120ep 基线一次续训；仅对当前图缺席的舰船类别做背景抑制。
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  group_detr: 1
  gradient_checkpointing: true
  pretrain_weights: output/proto_guidance_alignment_repair/00_baseline_1024/checkpoint_best_total.pth
  proto_guidance_enabled: true
  proto_guidance_artifacts_path: data/proto_guidance_shwx_1024_current.pt
  proto_guidance_fusion_mode: simple
  proto_guidance_num_slots: 10
  proto_guidance_target_classes: [0, 1, 2, 3]
  proto_guidance_position_enabled: true
  proto_guidance_content_enabled: false
  proto_guidance_aux_loss_enabled: false
  proto_guidance_dense_loss_enabled: true
  proto_guidance_dense_loss_weight: 0.5
  proto_guidance_dense_foreground_loss_enabled: true
  proto_guidance_dense_foreground_loss_weight: 0.75
  proto_guidance_dense_background_ratio: 1.0
  proto_guidance_position_score_mode: foreground_semantic
  proto_guidance_position_semantic_weight: 0.25
  proto_guidance_position_score_std_ratio: 0.25
  proto_guidance_lambda_pos_init: 0.0
  proto_guidance_lambda_pos_max: 0.35
  proto_guidance_warmup_epochs: 4.0
  proto_guidance_dense_iou_pos: 0.3
  proto_guidance_dense_iou_ignore: 0.1
  proto_guidance_dense_center_fallback_topk: 6
  proto_guidance_slot_reduction: lse
  proto_guidance_slot_reduction_tau: 0.1
  proto_guidance_tau_p: 0.2

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-full_test
  dataset_file: yolo
  output_dir: output/PAN续训实验/PAN从120ep单阶段复现-v2-背景抑制
  epochs: 14
  batch_size: 16
  grad_accum_steps: 4
  num_workers: 6
  lr: 5.0e-6
  lr_encoder: 1.0e-6
  lr_scheduler: cosine
  lr_scheduler_kwargs:
    min_factor: 0.1
  warmup_epochs: 1.0
  weight_decay: 1.0e-4
  clip_max_norm: 0.1
  eval_interval: 1
  checkpoint_interval: 2
  skip_best_epochs: 1
  use_ema: true
  ema_decay: 0.993
  ema_tau: 100
  seed: 61
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  compute_val_loss: false

  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false
  scale_jitter: true
  class_balanced_sampling: true
  class_balanced_threshold: 0.25
  class_balanced_class_ids: [0, 1]
  class_balance_enabled: false
  logit_adjustment_enabled: false

  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx.pt
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.035
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: [0, 1, 2, 3]
  sscl_confusing_classes: [0, 1, 2, 3]
  sscl_start_epoch: 3
  sscl_freeze_strategy: conservative
  sscl_unfreeze_decoder_layers: 2
  sscl_prototype_enabled: true
  sscl_prototype_momentum: 0.99
  sscl_prototype_min_samples: 1
  sscl_prototype_max_slots: 2
  sscl_prototype_multi_slot_classes: [0, 1, 2, 3]
  sscl_prototype_group_pairs: [[0, 1], [2, 3]]
  sscl_prototype_group_weight: 1.2
  sscl_projection_enabled: true
  sscl_projection_dim: 128
  sscl_prototype_instance_pos: true

  # 仅在该类别不出现在当前图时抑制背景 query，避免同类重复框和定位偏差真阳被当成负样本。
  sscl_hard_neg_enabled: true
  sscl_hard_neg_selection_mode: class_balanced
  sscl_hard_neg_class_quota: 1
  sscl_hard_neg_require_class_absent: true
  sscl_hard_neg_topk: 3
  sscl_hard_neg_score_thresh: -1.2
  sscl_hard_neg_log_interval: 1
  sscl_hard_neg_target_classes: [0, 1, 2]
  sscl_hard_neg_iou_low: 0.0
  sscl_hard_neg_iou_high: 0.08
  sscl_hard_neg_loss_lambda: 0.02
  sscl_hard_neg_target_logit_margins: {2: -1.8}
  sscl_hard_neg_logit_margin: -1.5
  sscl_hard_neg_logit_temperature: 1.0
  sscl_hard_neg_proto_source: proto_guidance
  sscl_hard_neg_proto_lambda: 0.01
  sscl_hard_neg_proto_margin: 0.1
  sscl_hard_neg_proto_temperature: 0.1
  sscl_hard_neg_start_epoch: 6

  sscl_distill_enabled: false
  sscl_teacher_checkpoint: null

test:
  dataset: shwx
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-full_test
  resolution: 1024
  checkpoint: output/PAN续训实验/PAN从120ep单阶段复现-v2-背景抑制/checkpoint_pan_selected_fixed025.pth
  output_dir: output/PAN续训实验/PAN从120ep单阶段复现-v2-背景抑制/full_test_selected_fixed025
  conf_threshold: 0.25
  class_conf_thresholds: {}
  device: cuda:0
  batch_size: 32
  num_workers: 12
  prefetch_factor: 3
  use_fp16: false
  save_fp_fn: true
  save_yolo_preds: false
