# SHWX 26 类基线：在原 25 类基础上新增 truck=25（普通军用卡车，无发射架）。
# 用法：python src/scripts/train.py -c configs/experiments/train_baseline_medium_26_truck.yaml
model:
  variant: medium
  num_classes: 26
  resolution: 1024
  gradient_checkpointing: true
  freeze_encoder: false

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-truck-safe
  dataset_file: yolo
  output_dir: output/0819-SHWX-medium-baseline-truck-safe
  epochs: 120
  batch_size: 16
  grad_accum_steps: 4
  num_workers: 6
  lr: 1e-4
  lr_encoder: 1.5e-4
  weight_decay: 1e-4
  clip_max_norm: 0.1
  multi_scale: true
  lr_drop: 70
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 5
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.1
  class_balanced_sampling: true
  class_balanced_threshold: null
  class_balanced_class_ids: [0, 1]
  dataset_cache_mode: raw
  dataset_cache_dir: null
  dataset_cache_rebuild: false

test:
  dataset: shwx_truck
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-truck
  resolution: 1024
  checkpoint: output/0820-SHWX-medium-baseline-26class-truck-1024/checkpoint_best_total.pth
  output_dir: output/0820-SHWX-medium-baseline-26class-truck-1024-eval
  conf_threshold: 0.25
  class_conf_thresholds: {}
  device: cuda:0
  batch_size: 32
  num_workers: 12
  prefetch_factor: 3
  gpu_util_sample_interval: 0.5
  use_fp16: false
  save_fp_fn: true
  save_yolo_preds: false
