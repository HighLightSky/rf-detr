# SSCL 判别性矩阵实验 B（等价旧 train_sscl_strong.py 的 B 配方）
# 0807 配方 + 判别性 CLIP 提示词矩阵（prompts/shwx_disc.yaml 构建），超参不变
# 用法: python src/scripts/train.py -c configs/experiments/train_sscl_strong_B.yaml
model:
  variant: medium
  num_classes: 25
  resolution: 640
  gradient_checkpointing: true
  pretrain_weights: output/0805-SHWX-data-expand-rfdetr-baseline/checkpoint_best_total.pth

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict
  dataset_file: yolo
  output_dir: output/0811-SHWX-SSCL-DiscPrompt
  epochs: 6
  batch_size: 32
  grad_accum_steps: 2
  num_workers: 12
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 6
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false
  # --- SSCL（判别性矩阵，超参保持 0807 原值）---
  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx_disc.pt   # ← 判别矩阵
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.02
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: [0, 1, 2, 3]
  sscl_confusing_classes: [0, 1, 2, 3]
  sscl_start_epoch: 0
  sscl_freeze_strategy: conservative
  sscl_prototype_enabled: true
  sscl_prototype_momentum: 0.99
  sscl_prototype_min_samples: 1
  sscl_projection_enabled: true
  sscl_projection_dim: 128
  sscl_prototype_instance_pos: true
  sscl_distill_enabled: false
  sscl_teacher_checkpoint: null
  sscl_protected_classes: null
