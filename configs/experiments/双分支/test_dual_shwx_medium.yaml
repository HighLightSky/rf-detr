# SHWX PAN/RGB 双模型合并评估。
# 用法：python src/scripts/test_dual_shwx.py -c configs/experiments/test_dual_shwx_medium.yaml
test_dual:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-full_test
  cache_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-full_test/.rfdetr_dual_cache/shwx_v1
  # PAN 使用 v3：船舶 macro FDR 为 0.0961，是当前最低虚警候选。
  # RGB 使用 ProtoGuidance 对齐修复基线：飞机指标更优，FSC FDR=0.2887。
  output_dir: output/dual-v3-pan-proto00-rgb-1024/test_dual
  pan_checkpoint: output/sscl-macro-balanced-v3-ship-hardneg/checkpoint_best_total.pth
  pan_checkpoint_class_space: global
  rgb_checkpoint: output/proto_guidance_alignment_repair/00_baseline_1024/checkpoint_best_total.pth
  rgb_checkpoint_class_space: global
  resolution: 1024
  conf_threshold: 0.25
  class_conf_thresholds: {}
  device: cuda:0
  batch_size: 32
  num_workers: 12
  prefetch_factor: 3
  gpu_util_sample_interval: 0.5
  use_fp16: false
  save_fp_fn: true
