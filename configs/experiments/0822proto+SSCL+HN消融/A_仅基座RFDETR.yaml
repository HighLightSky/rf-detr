# A：仅基座 RF-DETR，对应所有原型模块、SSCL 与难负样本抑制均关闭的检测基线。
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  pretrain_weights: output/0815-SHWX-rfdetr-medium-baseline-精细标注-1024/checkpoint_best_total.pth

  # 多模态原型引导
  proto_guidance_enabled: false

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/0822-proto-sscl-hn-ablation/A-baseline
  epochs: 10
  batch_size: 32
  grad_accum_steps: 2
  num_workers: 6
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_scheduler: step
  lr_scheduler_kwargs: {lr_drop: 8}
  warmup_epochs: 0.0
  seed: 42
  tensorboard: true
  wandb: false
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false

  # 类均衡采样与数据增强控制
  class_balanced_sampling: true
  class_balanced_class_ids: [0, 1, 24]
  patch_paste_enabled: false

  # SSCL 与难负样本抑制
  sscl_enabled: false
  sscl_hard_neg_enabled: false

  # 统一全量微调，避免与启用模块的分支产生冻结范围混杂
  sscl_freeze_strategy: none
