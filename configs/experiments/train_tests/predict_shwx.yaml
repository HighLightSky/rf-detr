# SHWX 单图/批量推理配置
# 用法:
#   python src/scripts/predict.py -c configs/experiments/predict_shwx.yaml --image /path/to/image.jpg
#   python src/scripts/predict.py -c configs/experiments/predict_shwx.yaml --image /path/to/folder --conf 0.3
predict:
  checkpoint: output/0822-rfdetr-final-baseline/checkpoint_best_total.pth
  # 相对项目根路径
  conf: 0.25
  output_dir: output/0822-FINAL-baseline-predict
  image: /home/liu/wzt/datasets/SHWX-FINAL-truck/images/train/fsc_TG-N25.20-E121.42-lv20-Google_crop0001.jpg
  class_names: shwx # 类别名来源：内置名 shwx/shwx_truck/dior，或 {label: 名称} 字典
  reason_plugin:
    enabled: false # 默认关闭；仅改为 true 时启用插件
    checkpoint: null # 插件 checkpoint 路径，例如 output/reason_plugin.pth
    class_ids: [24] # 需要重打分的类别；null 表示全部类别
    conf_low: null # 候选框下限；null 使用插件 checkpoint 内置值
