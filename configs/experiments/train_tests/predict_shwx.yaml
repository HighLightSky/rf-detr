# SHWX 单图/批量推理配置
# 用法:
#   python src/scripts/predict.py -c configs/experiments/train_tests/predict_shwx.yaml
predict:
  checkpoint: output/0824-rfdetr-final-baseline/inference_checkpoint_89.pth
  # 相对项目根路径
  conf: 0.25
  output_dir: output/0825-重标注参考
  image: /home/liu/wzt/datasets/SHWX-FINAL-no-FSC-expand/images/train/
  class_names: shwx # 类别名来源：内置名 shwx/shwx_truck/dior，或 {label: 名称} 字典
  ms_nms:
    enabled: true
    ms_class_id: 3
    ship_class_ids: [0, 1, 2, 3]
    same_class_iou: 0.80
    same_class_containment: 0.90
    same_class_center_ratio: 0.35
    cross_class_iou: 0.90
    cross_class_containment: 0.95
    cross_class_center_ratio: 0.25
    cross_class_score_margin: 0.05
    keep_ambiguous_cross_class: true
  label_comparison:
    enabled: true
    labels_dir: /home/liu/wzt/datasets/SHWX-FINAL-no-FSC-expand/labels/train/
    iou_threshold: 0.50 # 同类别预测与标签匹配阈值
  reason_plugin:
    enabled: false # 默认关闭；仅改为 true 时启用插件
    checkpoint: null # 插件 checkpoint 路径，例如 output/reason_plugin.pth
    class_ids: [24] # 需要重打分的类别；null 表示全部类别
    conf_low: null # 候选框下限；null 使用插件 checkpoint 内置值
  # --- 二阶段 FSC 复核插件（默认关闭）---
  two_stage:
    enabled: false
    backend: dinov3
    checkpoint: null
    backbone_checkpoint: null
    class_ids: [24]
    candidate_floor: 0.05
    candidate_nms_iou: 0.5
    candidate_containment_nms_enabled: false # 包含感知 NMS；true 时额外按包含率和中心距离抑制重复候选
    candidate_nms_containment: 0.95
    candidate_nms_center_ratio: 0.35
    context_scale: 2.0
    image_size: 224
    batch_size: 64
    positive_threshold: 0.5
    bypass_score: null
    detector_score_weight: 0.0
