# SHWX 数据集测试评估配置（比赛口径：ship/aircraft IoU=0.50，vehicle=0.35）
# 用法: python src/scripts/test.py -c configs/experiments/test_shwx.yaml
test:
  dataset: shwx # eval_lib.DATASET_CONFIGS 内置名（shwx/dior）
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-full_test
  resolution: 1024
  checkpoint: output/0825发射车虚警抑制/原型前向加难负样本抑制/last_ema.pth
  output_dir: output/0825发射车虚警抑制/原型前向加难负样本抑制
  conf_threshold: 0.25 # 全局置信度阈值
  class_conf_thresholds: {} # 逐类阈值 {类别id: 阈值}；可整段贴入 calibrate_thresholds 产物
  device: cuda:0 # 无 CUDA 时自动回退 CPU
  batch_size: 32 # GPU 单次前向图像数
  num_workers: 12 # CPU 预取 worker 数
  prefetch_factor: 3
  precision: auto
  compile_model: false
  copy_prefetch: true
  warmup_batches: 1
  progress_interval_s: 1.0
  gpu_monitor_enabled: false
  reason_plugin:
    enabled: false # 默认关闭；仅改为 true 时启用 FFT 一致性插件
    checkpoint: output/0818reasoning-candidate/reason_plugin_fsc.pth # 已训练插件 checkpoint 路径
    class_ids: [24] # 重打分类别；null 表示全部类别
    conf_low: null # 候选框下限；null 使用插件 checkpoint 内置值
  save_fp_fn: true # 保存 FP/FN 可视化
  large_image_min_side: 2000 # 大图判定阈值（长边≥该值视为大图），大图的 FP/FN 可视化单独存到 output_dir/large_errors/
  # --- 大图切分（边界检测 → 裁切 → 目标检测 → 映射回原图）---
  boundary_backend: rfdetr # yolo 使用 YOLO11m；rfdetr 使用 RF-DETR nano
  boundary_checkpoint: data/large_cut/rf-detr-nano-large-cut.pth
  # RF-DETR nano 对照配置：boundary_backend: rfdetr，boundary_checkpoint: data/large_cut/rf-detr-nano-large-cut.pth
  boundary_resolution: 704 # YOLO11m 训练分辨率；切回 RF-DETR nano 时改为 704
  boundary_conf: 0.25 # 边界框置信度阈值
  detector_conf: 0.25 # 裁窗目标检测置信度阈值
  tiling_padding: 0 # 裁窗外扩像素
  tiling_nms_iou: 0.5 # 边界框 NMS IoU 阈值（0 关闭）
  tiling_square_stretch: false # 边界检测用方形拉伸替代 letterbox
  tiling_batch_size: 8 # 边界检测器 GPU 批量大小
  tiling_num_workers: 4 # 边界检测器预取 worker 数
  max_pending_crops: 128
  roi_backend: auto
  proxy_max_side: 704
  roi_output_size: null
  roi_queue_size: 128
  roi_cache_dir: null
  strict_roi_backend: false
  save_yolo_preds: false # 输出 YOLO 格式预测框（供归因/探针脚本复用）
