# SHWX PAN/RGB 双模型跨域实验。
# 用法：python src/scripts/train_dual_shwx.py -c configs/experiments/train_dual_shwx_medium.yaml
dual:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-full_test
  cache_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-full_test/.rfdetr_dual_cache/shwx_v1
  output_dir: output/dual-shwx-medium-1024
  variant: medium
  resolution: 1024
  epochs: 120
  pretrain_weights: null
  batch_size: 24
  grad_accum_steps: 3
  effective_batch_size: 72
  pan_class_balanced_class_ids: [0, 1]
  rgb_class_balanced_class_ids: [20]
  cache_rebuild: false
  dataset_cache_mode: raw
  dataset_cache_dir: null
  dataset_cache_rebuild: false

model:
  gradient_checkpointing: true
  freeze_encoder: false

train:
  num_workers: 12
  lr: 1e-4
  lr_encoder: 1.5e-4
  weight_decay: 1e-4
  clip_max_norm: 0.1
  multi_scale: false
  lr_drop: 70
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 5
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  class_balanced_sampling: true
  class_balanced_threshold: null
