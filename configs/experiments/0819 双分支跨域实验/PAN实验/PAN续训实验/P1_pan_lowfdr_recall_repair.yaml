# PAN 续训 P1：从现有低虚警 PAN 权重出发，用纯检测损失修复召回。
# 与 P0 形成互补：P0 从 120 epoch 基线适配 PAN 域，P1 优先保留已有低 FDR。
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  freeze_encoder: false
  pretrain_weights: output/sscl-macro-balanced-v3-ship-hardneg/checkpoint_best_total.pth
  proto_guidance_enabled: false

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-full_test/.rfdetr_dual_cache/shwx_v1/pan
  dataset_file: yolo
  output_dir: output/PAN续训实验/P1_pan_lowfdr_recall_repair
  epochs: 8
  batch_size: 4
  grad_accum_steps: 16
  num_workers: 3
  lr: 5.0e-6
  lr_encoder: 1.0e-6
  lr_scheduler: cosine
  lr_scheduler_kwargs:
    min_factor: 0.1
  warmup_epochs: 0.5
  weight_decay: 1.0e-4
  clip_max_norm: 0.1
  eval_interval: 1
  checkpoint_interval: 4
  skip_best_epochs: 1
  use_ema: true
  ema_decay: 0.99
  ema_tau: 100
  seed: 43
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  compute_val_loss: false

  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: true
  expanded_scales: false
  scale_jitter: true

  # 只对 HM/LQS 做温和过采样，避免稀有类召回在修复 MS/QHS 时回退。
  class_balanced_sampling: true
  class_balanced_threshold: null
  class_balanced_class_ids: [0, 1]

  class_balance_enabled: false
  logit_adjustment_enabled: false
  sscl_enabled: false
  sscl_hard_neg_enabled: false

test:
  dataset: shwx
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo-full_test
  resolution: 1024
  checkpoint: output/PAN续训实验/P1_pan_lowfdr_recall_repair/checkpoint_best_total.pth
  output_dir: output/PAN续训实验/P1_pan_lowfdr_recall_repair/full_test
  conf_threshold: 0.25
  class_conf_thresholds: {}
  device: cuda:0
  batch_size: 32
  num_workers: 12
  prefetch_factor: 3
  precision: auto
  save_fp_fn: false
  save_yolo_preds: false
