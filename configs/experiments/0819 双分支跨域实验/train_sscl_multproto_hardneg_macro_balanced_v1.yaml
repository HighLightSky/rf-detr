# SSCL 多原型 + 类均衡难例抑制 v1。
#
# 目标：以当前 ProtoGuidance checkpoint 为起点，保留 IoU 重复框保护，
# 只在船舶三类上施加难例抑制；FSC 已验证会发生召回塌陷，改由推理校准处理。
# 用法：python src/scripts/train.py -c configs/experiments/train_sscl_multproto_hardneg_macro_balanced_v1.yaml
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  pretrain_weights: output/0816在120ep1024基础上续训多模态原型-效果最好/0816-SHWX-ProtoGuidance-E4-hardneg-fsc-次好-当前最佳/checkpoint_best_total.pth
  proto_guidance_enabled: true
  proto_guidance_artifacts_path: data/proto_guidance_shwx.pt
  proto_guidance_fusion_mode: simple
  proto_guidance_num_slots: 10
  proto_guidance_position_enabled: true
  proto_guidance_content_enabled: true
  proto_guidance_aux_loss_enabled: true
  proto_guidance_aux_loss_weight: 1.0
  proto_guidance_warmup_epochs: 2.0
  proto_guidance_lambda_pos_init: 0.05
  proto_guidance_lambda_pos_max: 1.0
  proto_guidance_gamma_content_init: 0.05
  proto_guidance_gamma_content_max: 1.0
  proto_guidance_tau_p: 0.2

train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/sscl-macro-balanced-v3-ship-hardneg
  epochs: 18
  batch_size: 32
  grad_accum_steps: 2
  num_workers: 6
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 18
  warmup_epochs: 0.0
  tensorboard: true
  wandb: false
  device: cuda
  devices: 1
  num_nodes: 1
  resume: ""
  eval_interval: 1
  use_ema: true
  compute_val_loss: false
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false

  sscl_enabled: true
  sscl_semantic_matrix_path: data/semantic_matrix_shwx.pt
  sscl_matrix_normalize: minmax
  sscl_lambda: 0.04
  sscl_tau: 0.1
  sscl_rho: 0.3
  sscl_omega_max: 2.0
  sscl_anchor_classes: [0, 1, 2, 3]
  sscl_confusing_classes: [0, 1, 2, 3]
  sscl_start_epoch: 0
  sscl_freeze_strategy: conservative
  sscl_unfreeze_decoder_layers: 2

  sscl_prototype_enabled: true
  sscl_prototype_momentum: 0.99
  sscl_prototype_min_samples: 1
  sscl_prototype_max_slots: 2
  sscl_prototype_multi_slot_classes: [0, 1, 2, 3]
  sscl_prototype_group_pairs: [[0, 1], [2, 3]]
  sscl_prototype_group_weight: 1.25
  sscl_projection_enabled: true
  sscl_projection_dim: 128
  sscl_prototype_instance_pos: true

  sscl_hard_neg_enabled: true
  sscl_hard_neg_selection_mode: class_balanced
  sscl_hard_neg_class_quota: 1
  # 同图类别保护会使每图候选降至 0.078，无法对宏 FDR 产生实际影响；
  # 保留 IoU 上界保护重复框，允许同图中的低 IoU 高分虚警参与抑制。
  sscl_hard_neg_require_class_absent: false
  sscl_hard_neg_topk: 5
  sscl_hard_neg_score_thresh: -0.7
  sscl_hard_neg_log_interval: 100
  sscl_hard_neg_target_classes: [0, 1, 2]
  sscl_hard_neg_iou_low: 0.0
  sscl_hard_neg_iou_high: 0.15
  sscl_hard_neg_loss_lambda: 0.12
  sscl_hard_neg_target_logit_margins: {}
  sscl_hard_neg_target_loss_lambdas: {}
  sscl_hard_neg_logit_margin: -1.5
  sscl_hard_neg_logit_temperature: 1.0
  sscl_hard_neg_proto_source: proto_guidance
  sscl_hard_neg_proto_lambda: 0.08
  sscl_hard_neg_proto_margin: 0.1
  sscl_hard_neg_proto_temperature: 0.1
  sscl_hard_neg_start_epoch: 2

  sscl_distill_enabled: false
  class_balance_enabled: false
  logit_adjustment_enabled: false

test:
  dataset: shwx
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  resolution: 1024
  checkpoint: output/sscl-macro-balanced-v3-ship-hardneg/checkpoint_best_total.pth
  output_dir: output/sscl-macro-balanced-v3-ship-hardneg
  conf_threshold: 0.25
  class_conf_thresholds: {}
  device: cuda:0
  batch_size: 32
  num_workers: 12
  prefetch_factor: 3
  use_fp16: false
  save_fp_fn: true
  save_yolo_preds: false
