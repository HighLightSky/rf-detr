# 阶段四：dense 对齐后恢复 query selection，lambda=0.50
model:
  variant: medium
  num_classes: 25
  resolution: 1024
  gradient_checkpointing: true
  pretrain_weights: output/proto_guidance_alignment_repair/12_dense_ce_lse_slots/checkpoint_best_total.pth
  proto_guidance_enabled: true
  proto_guidance_artifacts_path: data/proto_guidance_shwx_1024_current.pt
  proto_guidance_fusion_mode: simple
  proto_guidance_num_slots: 10
  proto_guidance_position_enabled: true
  proto_guidance_content_enabled: false
  proto_guidance_dense_loss_enabled: true
  proto_guidance_dense_loss_weight: 1.0
  proto_guidance_lambda_pos_init: 0.05
  proto_guidance_lambda_pos_max: 0.5
  proto_guidance_warmup_epochs: 2.0
  proto_guidance_slot_reduction: lse
  proto_guidance_slot_reduction_tau: 0.1
train:
  dataset_dir: /home/liu/wzt/datasets/SHWX-dataset-dict-redo
  dataset_file: yolo
  output_dir: output/proto_guidance_alignment_repair/22_dense_selection_lambda050
  epochs: 5
  batch_size: 16
  grad_accum_steps: 4
  num_workers: 6
  lr: 1e-5
  lr_encoder: 1e-5
  weight_decay: 1e-4
  clip_max_norm: 0.1
  lr_drop: 4
  device: cuda
  devices: 1
  eval_interval: 1
  use_ema: true
  aug_config: AERIAL
  mosaic_p: 0.0
  multi_scale: false
  sscl_freeze_strategy: conservative
  proto_guidance_freeze_all_except_proto: true
  proto_guidance_trainable_scope: all
